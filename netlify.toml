# Static store. Netlify runs the build and publishes dist/.
# HTTPS for toyotaclubiran.com is NOT issued yet: the live host still
# presents the *.netlify.app certificate. These redirects are correct
# once that certificate exists. Until then, forcing HTTPS makes browsers
# reject the site. See the README.

[build]
  command = "node scripts/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Canonical host is https://toyotaclubiran.com (no www).
[[redirects]]
  from = "http://toyotaclubiran.com/*"
  to = "https://toyotaclubiran.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.toyotaclubiran.com/*"
  to = "https://toyotaclubiran.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.toyotaclubiran.com/*"
  to = "https://toyotaclubiran.com/:splat"
  status = 301
  force = true

# Torob calls this URL with POST. A static file cannot answer that,
# so the request is proxied to a function. A snapshot JSON is also
# written at build time to /torob/products.json.
[[redirects]]
  from = "/torob_api/v3/products"
  to = "/.netlify/functions/torob"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
