# Static store. Netlify runs the build and publishes dist/.
# HTTPS for toyotaclubiran.com is NOT issued yet: the live host still
# presents the *.netlify.app certificate. These redirects are correct
# once that certificate exists. Until then, forcing HTTPS makes browsers
# reject the site. See the README.

[build]
  command = "node scripts/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Canonical host is the apex domain. Page canonical URLs stay https
# in the HTML. Do not force the browser onto https until Netlify has
# issued a Let's Encrypt certificate for toyotaclubiran.com. The host
# still presents the *.netlify.app certificate, so an http->https
# redirect sends every visitor into a certificate error.
#
# Re-enable the http->https rules below once that certificate is active,
# and remove the Strict-Transport-Security max-age=0 override.
#
# [[redirects]]
#   from = "http://toyotaclubiran.com/*"
#   to = "https://toyotaclubiran.com/:splat"
#   status = 301
#   force = true
#
# [[redirects]]
#   from = "http://www.toyotaclubiran.com/*"
#   to = "https://toyotaclubiran.com/:splat"
#   status = 301
#   force = true

# www stays on the same scheme. http://www must not be upgraded to https.
[[redirects]]
  from = "http://www.toyotaclubiran.com/*"
  to = "http://toyotaclubiran.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.toyotaclubiran.com/*"
  to = "https://toyotaclubiran.com/:splat"
  status = 301
  force = true

# Torob calls this URL with POST. A static file cannot answer that,
# so the request is proxied to a function. A snapshot JSON is also
# written at build time to /torob/products.json.
[[redirects]]
  from = "/torob_api/v3/products"
  to = "/.netlify/functions/torob"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Clears any HSTS pin so browsers do not upgrade http to https
    # while the custom-domain certificate is still *.netlify.app.
    # Remove this line when the Let's Encrypt certificate is active.
    Strict-Transport-Security = "max-age=0"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
