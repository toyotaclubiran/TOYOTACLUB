  categoriesLink: همه کالاها
  quotesEmpty: هنوز نظری منتشر نشده است. بعد از خرید، نظر واقعی همین‌جا می‌آید.
  modelsText: تجهیزات و لوازم جانبی مناسب مدل‌های مختلف تویوتا، از لندکروزر و
    پرادو تا هایلوکس، کمری و کرولا کراس را بررسی کنید. برای اطمینان از سازگاری
    هر محصول با خودروی خود، مشخصات آن را مطالعه کنید یا با کارشناسان تویوتا کلاب
    مشورت کنید.
