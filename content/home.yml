faqs:
  - q: چرا قیمت روی سایت نیست؟
    a: قیمت‌ها با استعلام اعلام می‌شود. شماره ۰۹۱۷۴۴۵۰۰۴۰ یا فرم همین صفحه را استفاده کنید.
  - q: موجودی چطور تأیید می‌شود؟
    a: موجود یا ناموجود بودن روی کالا نوشته شده است. تعداد دقیق با فروش عوض می‌شود و پیش از ثبت نهایی سفارش تأیید می‌گردد.
  - q: آیا فروشگاه فقط برای تویوتا است؟
    a: هدلایت و بسیاری از تجهیزات برای هر خودرویی با سوکت یا نصب مناسب است. بخش مدل‌های تویوتا مخصوص قطعاتی است که سازگاری‌شان با تویوتا ثبت شده.
  - q: ارسال به کدام شهرهاست؟
    a: ارسال به سراسر ایران انجام می‌شود. هزینه و زمان ارسال همراه استعلام قیمت گفته می‌شود. فروشگاه در شهرستان لامرد استان فارس است.
