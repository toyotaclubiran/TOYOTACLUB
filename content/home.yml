  socketsText: برای انتخاب هدلایت مناسب، ابتدا نوع سوکت چراغ خودروی خود را بررسی
    کنید. سوکت‌های رایج شامل H1، H4، H7، H11 و 9005 هستند. در صورت عدم اطمینان،
    از روی لامپ فابریک خودرو نوع سوکت را بررسی کنید یا برای دریافت راهنمایی با
    کارشناسان تویوتا کلاب تماس بگیرید.
  ledTitle: سری هدلایت EGLXEN
  modelsTitle: لوازم و تجهیزات مدل‌های تویوتا
  compareText: در این جدول می‌توانید مدل‌های مختلف هدلایت EGLXEN را از نظر توان،
    مشخصات روشنایی و نوع سوکت مقایسه کنید و متناسب با نیاز خودروی خود، مدل مناسب
    را انتخاب کنید. برای اطلاع از موجودی و دریافت مشاوره با ما تماس بگیرید.
  compareTitle: مقایسه سری D اگلزن
