faqs:
  - q: چرا قیمت روی سایت نیست؟
    a: قیمت‌ها با استعلام اعلام می‌شود. شماره ۰۹۱۷۴۴۵۰۰۴۰ یا فرم همین صفحه را
      استفاده کنید.
  - q: موجودی چطور تأیید می‌شود؟
    a: موجود یا ناموجود بودن روی کالا نوشته شده است. تعداد دقیق با فروش عوض می‌شود و
      پیش از ثبت نهایی سفارش تأیید می‌گردد.
  - q: ارسال به کدام شهرهاست؟
    a: >-
      ارسال سفارش‌ها به سراسر ایران انجام می‌شود. هزینه و زمان تحویل بسته به شهر
      مقصد، نوع محصول و روش ارسال متفاوت است و هنگام ثبت سفارش به اطلاع مشتری
      می‌رسد.


      مرکز فروش و توزیع تویوتا کلاب ایران در، استان فارس قرار دارد.
