"shortDescription": |-
  هدلایت LED اگلزن مدل D45 با درایور جدا، فن پرسرعت و چیپ خودرویی. نور سفید و پرقدرت برای رانندگی شب.
"description": |-
  مدل D45 انتخاب پرتوان سری اگلزن است: ۶۰ وات توان، ۱۱۰۰۰ لومن و بدنه نقره‌ای با جزئیات طلایی. درایور جدا پرش نور را کم می‌کند و فن ۱۲۰۰۰ دور، گرما را از لامپ دور نگه می‌دارد.

  برای هر خودرویی با سوکت سازگار مناسب است. سوکت‌های H7، 9005 و H4 موجودند. H1 و H11 در حال حاضر ناموجود است.

  در برخی خودروهای مجهز به کن‌باس ممکن است مقاومت بار لازم باشد. کابل شیلددار، نویز روی رادیو را کاهش می‌دهد.
