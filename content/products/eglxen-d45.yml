"claims":
  - "title": |-
      درایور دوگانه
    "text": |-
      کنترل دمای هوشمند و روشن‌شدن با توان کامل. عمر پیوسته بیش از ۳۰هزار ساعت. در بعضی خودروهای کن‌باس، مقاومت بار لازم است.
  - "title": |-
      فن و خنک‌کاری
    "text": |-
      فن ۱۲۰۰۰ دور با ساختار گرافین، صدای کم، و دوام طولانی در رانندگی پیوسته.
  - "title": |-
      چیپ LED
    "text": |-
      ۱۱هزار لومن و حدود ۲۰۰ درصد روشنایی بیشتر نسبت به هالوژن، با ۱۲ چیپ خودرویی در هر لامپ.
