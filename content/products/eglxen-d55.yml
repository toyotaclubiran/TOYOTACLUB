"description": |-
  D55 برای کسی است که نور بیشتر و مصرف کمتر می‌خواهد. توان ۵۵ وات، روشنایی تا ۵۰۰ درصد بیشتر، حدود ۸۰ درصد صرفه‌جویی انرژی و عمر طولانی‌تر نسبت به لامپ معمولی.

  سوکت‌های H7، H1، H11، 9005 و H4 موجودند و برای هر خودرویی با همان سوکت قابل استفاده‌اند.
