"shortDescription": |-
  هدلایت EGLXEN مدل D65 با بدنه خاکستری، دمای پایدار و روشن‌شدن سریع. توان ۶۵ وات.
"description": |-
  D65 نور بالا را با دمای کاری پایدار و روشن‌شدن سریع ترکیب می‌کند. توان ۶۵ وات، روشنایی بیشتر، مصرف کمتر و عمر طولانی‌تر برای استفاده هر روز.

  در سوکت‌های H7، H1، H11 و 9005 موجود است. سوکت H4 برای این مدل ناموجود است.
